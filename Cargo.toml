[workspace]
members = ["crates/analyzer-core", "crates/analyzer-app", "crates/analyzer-cli", "crates/analyzer-gui"]
default-members = ["crates/analyzer-core", "crates/analyzer-app", "crates/analyzer-cli"]
resolver = "3"

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
evtx = "0.12.3"
sysinfo = "0.39.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
toml = "0.9"
tempfile = "3"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"

[profile.release]
lto = "thin"
strip = true

# macOS 27 dyld rejects stripped proc-macro dylibs (rust-lang/rust#157750).
# Build-time tools are not shipped; the final program still uses strip = true.
[profile.release.build-override]
strip = false
