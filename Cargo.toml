[workspace]
members = ["crates/analyzer-core", "crates/analyzer-cli"]
resolver = "3"

[workspace.package]
version = "0.1.12"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
evtx = "0.12.3"
sysinfo = "0.39.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
toml = "0.9"
tempfile = "3"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
