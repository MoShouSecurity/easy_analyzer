name: build-and-test
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: cargo run --locked -- processes --limit 3
      - name: Windows native System log export
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cases | Out-Null
          wevtutil epl System cases/System.evtx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/easy-analyzer.exe logs cases/System.evtx --output json --out reports/system.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content reports/system.json -Raw | ConvertFrom-Json
          if ($report.sources.Count -ne 1) { throw 'Missing event log source' }
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/easy-analyzer README.md LICENSE dist/
          cp -R docs dist/docs
          cp -R tests/fixtures dist/samples
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/easy-analyzer.exe,README.md,LICENSE dist/
          Copy-Item docs dist/docs -Recurse
          Copy-Item tests/fixtures dist/samples -Recurse
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          mkdir -p dist/docs
          cp target/release/easy-analyzer README.md LICENSE dist/
          cp docs/MACOS.md docs/VALIDATION.md docs/DEFAULT_RULES.md dist/docs/
          sed 's|](DEFAULT_RULES.md)|](docs/DEFAULT_RULES.md)|g' docs/MACOS.md > dist/开始使用.md
          cp tools/macos-demo.command dist/演示.command
          chmod 755 dist/演示.command
          cp -R tests/fixtures dist/samples
          codesign --force --sign - dist/easy-analyzer
          codesign --verify --strict dist/easy-analyzer
          {
            echo "git_commit=$GITHUB_SHA"
            echo "architectures=$(uname -m)"
            echo "code_signing=ad-hoc (not notarized)"
          } > dist/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: easy-analyzer-${{ runner.os }}-${{ runner.arch }}
          path: dist/
