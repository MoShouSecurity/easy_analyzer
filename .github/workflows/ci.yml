name: release-binaries
# 日常分支推送不触发；仅在用户要求“打包成 tag”后推送 vX.Y.Z 发布标签。
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            suffix: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_FILE: easy-analyzer-${{ matrix.platform }}${{ matrix.suffix }}
      BINARY_SUFFIX: ${{ matrix.suffix }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Validate release source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          SOURCE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$SOURCE_VERSION" = "$RELEASE_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target "$BUILD_TARGET"
      - name: Stage program only
        run: |
          mkdir -p release
          cp "target/$BUILD_TARGET/release/easy-analyzer$BINARY_SUFFIX" "release/$RELEASE_FILE"
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --force --sign - "release/$RELEASE_FILE"
            codesign --verify --strict "release/$RELEASE_FILE"
            lipo "release/$RELEASE_FILE" -verify_arch arm64
          fi
          BINARY_VERSION="$("release/$RELEASE_FILE" --version)"
          test "${BINARY_VERSION##* }" = "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: program-${{ matrix.platform }}
          path: release/${{ env.RELEASE_FILE }}
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish programs and SHA256
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: program-*
          path: release
          merge-multiple: true
      - name: Generate and verify SHA256
        shell: bash
        run: |
          cd release
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum easy-analyzer-linux-x64 easy-analyzer-windows-x64.exe easy-analyzer-macos-arm64 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          应急响应分析 CLI：日志、进程、离线网络分析及 AI 辅助分析，支持终端、JSON、HTML 报告。

          下载对应平台的独立程序；SHA256SUMS 包含三个程序的 SHA-256 校验值。
          macOS 为 Apple Silicon ARM64 版本，使用 ad-hoc 签名，未进行 Apple 公证。
          NOTES
      - name: Upload clean release draft
        shell: bash
        run: |
          cd release
          if gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/existing-release.json"; then
            # 失败后重跑可补全草稿，但不覆盖已经发布的版本。
            test "$(jq -r '.isDraft' "$RUNNER_TEMP/existing-release.json")" = true
            jq -e '[.assets[].name] - ["easy-analyzer-linux-x64", "easy-analyzer-windows-x64.exe", "easy-analyzer-macos-arm64", "SHA256SUMS"] | length == 0' "$RUNNER_TEMP/existing-release.json"
            gh release upload "$RELEASE_TAG" \
              easy-analyzer-linux-x64 easy-analyzer-windows-x64.exe easy-analyzer-macos-arm64 SHA256SUMS \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              easy-analyzer-linux-x64 easy-analyzer-windows-x64.exe easy-analyzer-macos-arm64 SHA256SUMS \
              --verify-tag --draft --title "Easy Analyzer $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort' > "$RUNNER_TEMP/release-assets.json"
          jq -e '. == (["easy-analyzer-linux-x64", "easy-analyzer-windows-x64.exe", "easy-analyzer-macos-arm64", "SHA256SUMS"] | sort)' "$RUNNER_TEMP/release-assets.json"
      - name: Publish release
        shell: bash
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$RUNNER_TEMP/release-notes.md"
