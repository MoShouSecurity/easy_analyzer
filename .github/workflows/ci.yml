name: build-and-test
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: cargo run --locked -- processes --limit 3
      - name: Windows native System log export
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cases | Out-Null
          wevtutil epl System cases/System.evtx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/easy-analyzer.exe logs cases/System.evtx --output json --out reports/system.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content reports/system.json -Raw | ConvertFrom-Json
          if ($report.sources.Count -ne 1) { throw 'Missing event log source' }
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/easy-analyzer-linux-x64
          cp target/release/easy-analyzer README.md LICENSE dist/easy-analyzer-linux-x64/
          cp -R tests/fixtures dist/easy-analyzer-linux-x64/samples
          tar -czf dist/easy-analyzer-linux-x64.tar.gz -C dist easy-analyzer-linux-x64
          sha256sum dist/easy-analyzer-linux-x64.tar.gz > dist/easy-analyzer-linux-x64.tar.gz.sha256
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/easy-analyzer-windows-x64 | Out-Null
          Copy-Item target/release/easy-analyzer.exe,README.md,LICENSE dist/easy-analyzer-windows-x64/
          Copy-Item tests/fixtures dist/easy-analyzer-windows-x64/samples -Recurse
          Compress-Archive dist/easy-analyzer-windows-x64/* dist/easy-analyzer-windows-x64.zip
          (Get-FileHash dist/easy-analyzer-windows-x64.zip -Algorithm SHA256).Hash | Set-Content dist/easy-analyzer-windows-x64.zip.sha256
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          package="easy-analyzer-macos-$(uname -m)"
          mkdir -p "dist/$package/docs"
          cp target/release/easy-analyzer README.md LICENSE "dist/$package/"
          cp docs/MACOS.md docs/VALIDATION.md "dist/$package/docs/"
          cp docs/MACOS.md "dist/$package/开始使用.md"
          cp tools/macos-demo.command "dist/$package/演示.command"
          chmod 755 "dist/$package/演示.command"
          cp -R tests/fixtures "dist/$package/samples"
          codesign --force --sign - "dist/$package/easy-analyzer"
          codesign --verify --strict "dist/$package/easy-analyzer"
          {
            echo "git_commit=$GITHUB_SHA"
            echo "architectures=$(uname -m)"
            echo "code_signing=ad-hoc (not notarized)"
          } > "dist/$package/BUILD_INFO.txt"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          shasum -a 256 "dist/$package.tar.gz" > "dist/$package.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: easy-analyzer-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
